<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retailers - EMI Locker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 15px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .header .left { display: flex; align-items: center; }
  .header a { color: #facc15; text-decoration: none; font-size: 24px; margin-right: 15px; }
  .header h1 { font-size: 18px; color: #facc15; }
  .btn-add { background: #22c55e; color: #fff; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; border: none; cursor: pointer; }

  .search-box { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; margin-bottom: 15px; outline: none; }
  .search-box:focus { border-color: #facc15; }

  .retailer-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #3b82f6; position: relative; }
  .retailer-card h3 { font-size: 15px; margin-bottom: 5px; color: #fff; }
  .retailer-card p { font-size: 12px; color: #94a3b8; margin-bottom: 3px; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; margin-top: 5px; background: #3b82f6; color: #fff; }
  .stats-mini { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .stats-mini div { background: #0f172a; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: #facc15; }

  .action-btns { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
  .btn-icon { background: #334155; border: none; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .btn-icon.edit { background: #3b82f6; }
  .btn-icon.delete { background: #ef4444; }

  .no-result { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 30px; }
</style>
</head>
<body>

  <div class="header">
    <div class="left">
      <a href="index.html">←</a>
      <h1>All Retailers</h1>
    </div>
    <div style="display: flex; gap: 8px;">
      <button onclick="exportRetailers()" class="btn-add" style="background: #3b82f6;">📥 Export</button>
      <a href="add-retailer.html" class="btn-add">➕ Add</a>
    </div>
  </div>

  <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by Shop, Owner or Location...">

  <div id="retailerList"></div>

  <script>
    var container = document.getElementById("retailerList");

    // Default retailers
    var defaultRetailers = [
      { id: "ret1", shop: "Sharma Mobile Point", owner: "Rajesh Sharma", location: "Noida, Sector 18", total: 45, active: 40, locked: 5 },
      { id: "ret2", shop: "Verma Electronics", owner: "Priya Verma", location: "Delhi, Rohini", total: 30, active: 28, locked: 2 },
      { id: "ret3", shop: "Khan Mobile Center", owner: "Abraz Khan", location: "Mumbai, Andheri", total: 60, active: 50, locked: 10 }
    ];

    // Add-retailer se aayi nayi retailers
    var newRetailers = JSON.parse(localStorage.getItem("allRetailers")) || [];

    // Dono ko jod do
    var allRetailers = defaultRetailers.concat(newRetailers);

    function renderRetailers(list) {
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = '<p class="no-result">❌ No retailers found!</p>';
        return;
      }

      list.forEach(function (r) {
        var card = document.createElement("div");
        card.className = "retailer-card";

        card.innerHTML = `
          <h3>🏪 ${r.shop}</h3>
          <p>Owner: ${r.owner}</p>
          <p>Location: ${r.location || "-"}</p>
          <div class="stats-mini">
            <div>Total: ${r.total}</div>
            <div>Active: ${r.active}</div>
            <div>Locked: ${r.locked}</div>
          </div>
          <span class="badge">Verified</span>
          <div class="action-btns">
            <button class="btn-icon edit" onclick="editRetailer('${r.id}')">✏️</button>
            <button class="btn-icon delete" onclick="deleteRetailer('${r.id}')">🗑️</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    renderRetailers(allRetailers);

    // Search
    document.getElementById("searchInput").addEventListener("input", function (e) {
      var text = e.target.value.toLowerCase();
      var filtered = allRetailers.filter(function (r) {
        return r.shop.toLowerCase().includes(text) ||
               r.owner.toLowerCase().includes(text) ||
               (r.location || "").toLowerCase().includes(text);
      });
      renderRetailers(filtered);
    });

    // Delete
    function deleteRetailer(id) {
      if (!confirm("🗑️ Are you sure you want to delete this retailer?")) return;
      var newList = JSON.parse(localStorage.getItem("allRetailers")) || [];
      newList = newList.filter(function (r) { return r.id !== id; });
      localStorage.setItem("allRetailers", JSON.stringify(newList));
      location.reload();
    }

    // Edit
    function editRetailer(id) {
      var newList = JSON.parse(localStorage.getItem("allRetailers")) || [];
      var r = newList.find(function (item) { return item.id === id; });

      if (!r) {
        alert("ℹ️ Default retailers abhi edit nahi ho sakte.\n\nSirf naye add kiye gaye retailers edit ho sakte hain.");
        return;
      }

      var newShop = prompt("Shop Name:", r.shop);
      if (newShop === null) return;
      var newOwner = prompt("Owner Name:", r.owner);
      if (newOwner === null) return;

      r.shop = newShop;
      r.owner = newOwner;
      localStorage.setItem("allRetailers", JSON.stringify(newList));
      alert("✅ Retailer updated!");
      location.reload();
    }

    // Export
    function exportRetailers() {
      var csv = "Shop Name,Owner,Location,Total Devices,Active,Locked\n";
      allRetailers.forEach(function (r) {
        csv += `"${r.shop}","${r.owner}","${r.location || ""}","${r.total}","${r.active}","${r.locked}"\n`;
      });
      var blob = new Blob([csv], { type: "text/csv" });
      var url = window.URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "EMI_Locker_Retailers.csv";
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
